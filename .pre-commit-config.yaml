repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      # Ruff version.
      rev: v0.11.9
      hooks:
          # Run the linter.
          - id: ruff
            exclude: ^src/atlas/data/
            args: [--fix, --show-fixes]
            types_or: [python, pyi]
          # Run the formatter.
          #- id: ruff-format
          #  args: [--config, ./.ruff.toml]
          #  types_or: [ python, pyi ]
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          # - id: trailing-whitespace
          - id: end-of-file-fixer
            exclude: ^src/atlas/data/
          - id: check-yaml
          - id: check-added-large-files
            args: ["--maxkb=2048"]
          - id: check-toml
    - repo: local
      hooks:
          - id: update-docs-from-schema
            name: Update documentation from config schema
            entry: python -m atlas.core.command_line.cli_generate_docs --overwrite
            language: system
            files: ^src/atlas/data/config_schema\.yaml$
            pass_filenames: false
            description: "Regenerate docs/source/input.md when config_schema.yaml changes"
          - id: run-tests
            name: Run pytest tests
            # Use the ATLAS Python environment, and a throwaway AIIDA_PATH so
            # tests do not depend on the developer's AiiDA configuration.
            # Override the interpreter with ATLAS_TEST_PYTHON=/path/to/python.
            entry: >-
                bash -c '
                PY="${ATLAS_TEST_PYTHON:-$HOME/.virtualenvs/atlas_mace/bin/python}";
                AIIDA_PATH="$(mktemp -d)";
                AIIDA_PATH="$AIIDA_PATH" "$PY" -m pytest tests/ -x --tb=short;
                status=$?;
                rm -rf "$AIIDA_PATH";
                exit $status
                '
            language: system
            pass_filenames: false
            always_run: true
