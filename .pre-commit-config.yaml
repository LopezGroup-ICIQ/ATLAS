repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      # Ruff version.
      rev: v0.11.9
      hooks:
          # Run the linter.
          - id: ruff
            exclude: ^src/atlas/data/
            args: [--fix, --show-fixes]
            types_or: [python, pyi]
          # Run the formatter.
          #- id: ruff-format
          #  args: [--config, ./.ruff.toml]
          #  types_or: [ python, pyi ]
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          # - id: trailing-whitespace
          - id: end-of-file-fixer
            exclude: ^src/atlas/data/
          - id: check-yaml
          - id: check-added-large-files
            args: ["--maxkb=2048"]
          - id: check-toml
    - repo: local
      hooks:
          - id: update-docs-from-schema
            name: Update documentation from config schema
            entry: python -m atlas.core.command_line.cli_generate_docs --overwrite
            language: system
            files: ^src/atlas/data/config_schema\.yaml$
            pass_filenames: false
            description: "Regenerate docs/source/input.md when config_schema.yaml changes"
          - id: run-tests
            name: Run pytest tests
            # Pick an ATLAS Python environment: ATLAS_TEST_PYTHON, then an
            # activated venv, then the repo .venv, then the known dev envs.
            # A temporary AIIDA_PATH avoids the developer's AiiDA config.
            entry: |
                bash -c '
                AIIDA_PATH="$(mktemp -d)"
                export AIIDA_PATH
                trap "rm -rf \"$AIIDA_PATH\"" EXIT

                usable() {
                    command -v "$1" >/dev/null 2>&1 && "$1" -c "import atlas, pytest" >/dev/null 2>&1
                }

                if [ -n "${ATLAS_TEST_PYTHON:-}" ]; then
                    PY="$ATLAS_TEST_PYTHON"
                    if ! usable "$PY"; then
                        echo "ATLAS_TEST_PYTHON=\"$PY\" cannot import atlas and pytest." >&2
                        exit 1
                    fi
                else
                    PY=""
                    for candidate in \
                        "${VIRTUAL_ENV:+$VIRTUAL_ENV/bin/python}" \
                        ".venv/bin/python" \
                        "venv/bin/python" \
                        "$HOME/.virtualenvs/atlas_mace/bin/python" \
                        "$HOME/.virtualenvs/atlas_mace_p312/bin/python" \
                        "$HOME/.virtualenvs/test_atlas_env/bin/python" \
                        "python3"; do
                        if usable "$candidate"; then
                            PY="$candidate"
                            break
                        fi
                    done
                    if [ -z "$PY" ]; then
                        echo "No Python environment with atlas and pytest found. Set ATLAS_TEST_PYTHON." >&2
                        exit 1
                    fi
                fi

                "$PY" -m pytest tests/ -x --tb=short
                '
            language: system
            pass_filenames: false
            always_run: true
